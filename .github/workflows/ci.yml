name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP 8.5 ZTS
        uses: shivammathur/setup-php@f3d967b8bc6d6fbb17cb0e2ffd56cf304d0290ba
        with:
          php-version: '8.5.11'
          coverage: none
          tools: composer:v2
        env:
          phpts: ts
          fail-fast: true
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy --component rustfmt
      - name: Install native build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev
      - name: Run runtime torture probes
        shell: bash
        run: |
          cargo +1.98.0 run --locked --release -p cobblestone-runtime-probe --bin runtime-torture
          cargo +1.98.0 run --locked --release -p cobblestone-runtime-probe --bin ownership-torture
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Verify repository
        run: cargo +1.98.0 xtask verify
      - name: Check Rust dependency policy (workspace)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          manifest-path: ./Cargo.toml
          rust-version: 1.98.0
      - name: Check Rust dependency policy (extension)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          manifest-path: ./native/extension/Cargo.toml
          rust-version: 1.98.0

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP 8.5 ZTS
        uses: shivammathur/setup-php@f3d967b8bc6d6fbb17cb0e2ffd56cf304d0290ba
        with:
          php-version: '8.5.11'
          coverage: none
          tools: composer:v2
        env:
          phpts: ts
          fail-fast: true
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Verify PHP ZTS runtime
        run: php tests/php/zts-probe.php
      - name: Install stable Rust
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy --component rustfmt
      - name: Install pinned nightly Rust for Windows adapter
        shell: bash
        run: rustup toolchain install nightly-2026-09-20 --profile minimal --component clippy --component rustfmt
      - name: Run runtime torture probes
        shell: bash
        run: |
          cargo +1.98.0 run --locked --release -p cobblestone-runtime-probe --bin runtime-torture
          cargo +1.98.0 run --locked --release -p cobblestone-runtime-probe --bin ownership-torture
      - name: Check Windows PHP adapter
        shell: pwsh
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        run: cargo +1.98.0 xtask native-check
      - name: Build Windows PHP adapter
        shell: pwsh
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        run: cargo +1.98.0 xtask native-build
      - name: Verify Windows RakNet loopback and session host
        shell: pwsh
        run: |
          cargo +1.98.0 test --locked -p cobblestone-raknet --test public_api
          cargo +1.98.0 test --locked -p cobblestone-session --test host
      - name: Validate Windows PHP adapter
        shell: pwsh
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        run: cargo +1.98.0 xtask test-php
