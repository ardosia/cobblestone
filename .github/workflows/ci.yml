name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP 8.5 ZTS
        uses: shivammathur/setup-php@f3d967b8bc6d6fbb17cb0e2ffd56cf304d0290ba
        with:
          php-version: '8.5.11'
          coverage: none
          tools: composer:v2
        env:
          phpts: ts
          fail-fast: true
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy --component rustfmt
      - name: Install native build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Verify repository
        run: cargo +1.98.0 xtask verify
      - name: Check Rust dependency policy (workspace)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          manifest-path: ./Cargo.toml
          rust-version: 1.98.0
      - name: Check Rust dependency policy (extension)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          manifest-path: ./native/extension/Cargo.toml
          rust-version: 1.98.0

  platform:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP 8.5 ZTS
        uses: shivammathur/setup-php@f3d967b8bc6d6fbb17cb0e2ffd56cf304d0290ba
        with:
          php-version: '8.5.11'
          coverage: none
          tools: composer:v2
        env:
          phpts: ts
          fail-fast: true
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Verify PHP ZTS runtime
        run: php tests/php/zts-probe.php
      - name: Install stable Rust
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy --component rustfmt
      - name: Run runtime torture probes
        shell: bash
        run: |
          cargo +1.98.0 run --locked --release -p cobblestone-runtime-probe --bin runtime-torture
          cargo +1.98.0 run --locked --release -p cobblestone-runtime-probe --bin ownership-torture
          cargo +1.98.0 run --locked --release -p cobblestone-runtime-probe --bin completion-gc-torture
      - name: Install pinned nightly Rust for Windows adapter
        if: runner.os == 'Windows'
        shell: bash
        run: rustup toolchain install nightly-2026-09-20 --profile minimal --component clippy --component rustfmt
      - name: Install libclang development files
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev
      - name: Build Linux PHP adapter
        if: runner.os == 'Linux'
        working-directory: native/extension
        shell: bash
        run: |
          cargo +1.98.0 fmt --check
          cargo +1.98.0 check --locked
          cargo +1.98.0 clippy --locked -- -D warnings
          cargo +1.98.0 build --locked --release
      - name: Build Windows PHP adapter
        if: runner.os == 'Windows'
        working-directory: native/extension
        shell: pwsh
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        run: |
          cargo +nightly-2026-09-20 fmt --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +nightly-2026-09-20 check --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +nightly-2026-09-20 clippy --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +nightly-2026-09-20 build --locked --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate PHP adapter
        shell: bash
        run: cargo +1.98.0 xtask test-php
