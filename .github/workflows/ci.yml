name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy --component rustfmt
      - name: Validate repository
        run: python tools/ci.py all

  php-zts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP 8.5 ZTS
        uses: shivammathur/setup-php@f3d967b8bc6d6fbb17cb0e2ffd56cf304d0290ba
        with:
          php-version: '8.5.11'
          coverage: none
          tools: composer:v2
        env:
          phpts: ts
          fail-fast: true
      - name: Verify PHP ZTS runtime
        run: php tests/php/zts-probe.php
      - name: Lint PHP sources
        run: php tools/project.php lint
      - name: Prepare Composer package
        shell: bash
        run: |
          composer setup
          composer validate --strict --no-check-publish
      - name: Verify Unix PHP development tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          command -v phpize
          command -v php-config
          php-config --version
      - name: Install stable Rust for runtime probe
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy --component rustfmt
      - name: Run multi-runtime message torture
        shell: bash
        run: cargo +1.98.0 run --locked --release -p cobblestone-runtime-probe --bin runtime-torture
      - name: Run ownership and handle torture
        shell: bash
        run: cargo +1.98.0 run --locked --release -p cobblestone-runtime-probe --bin ownership-torture
      - name: Run completion GC lifecycle torture
        shell: bash
        run: cargo +1.98.0 run --locked --release -p cobblestone-runtime-probe --bin completion-gc-torture
      - name: Install pinned nightly Rust for Windows adapter
        if: runner.os == 'Windows'
        shell: bash
        run: rustup toolchain install nightly-2026-09-20 --profile minimal --component clippy --component rustfmt
      - name: Install libclang development files
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev
      - name: Build Linux PHP adapter
        if: runner.os == 'Linux'
        working-directory: native/extension
        shell: bash
        run: |
          cargo +1.98.0 fmt --check
          cargo +1.98.0 check --locked
          cargo +1.98.0 clippy --locked -- -D warnings
          cargo +1.98.0 build --locked --release
      - name: Build Windows PHP adapter
        if: runner.os == 'Windows'
        working-directory: native/extension
        shell: pwsh
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        run: |
          cargo +nightly-2026-09-20 fmt --check
          cargo +nightly-2026-09-20 check --locked
          cargo +nightly-2026-09-20 clippy --locked -- -D warnings
          cargo +nightly-2026-09-20 build --locked --release
      - name: Validate PHP adapter
        shell: bash
        run: composer test:php
