name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy --component rustfmt
      - name: Validate repository
        run: python tools/ci.py all

  php-zts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP 8.5 ZTS
        uses: shivammathur/setup-php@f3d967b8bc6d6fbb17cb0e2ffd56cf304d0290ba
        with:
          php-version: '8.5.11'
          coverage: none
          tools: none
        env:
          phpts: ts
          fail-fast: true
      - name: Verify PHP ZTS runtime
        run: php tests/php/zts-probe.php
      - name: Verify Unix PHP development tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          command -v phpize
          command -v php-config
          php-config --version
      - name: Install stable Rust for runtime probe
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy --component rustfmt
      - name: Run multi-runtime message torture
        shell: bash
        run: cargo +1.98.0 run --release -p cobblestone-runtime-probe --bin runtime-torture
      - name: Run ownership and handle torture
        shell: bash
        run: cargo +1.98.0 run --release -p cobblestone-runtime-probe --bin ownership-torture
      - name: Run completion GC lifecycle torture
        shell: bash
        run: cargo +1.98.0 run --release -p cobblestone-runtime-probe --bin completion-gc-torture
      - name: Install pinned nightly Rust for Windows adapter
        if: runner.os == 'Windows'
        shell: bash
        run: rustup toolchain install nightly-2026-09-20 --profile minimal --component clippy --component rustfmt
      - name: Install libclang development files
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev
      - name: Build Linux PHP adapter
        if: runner.os == 'Linux'
        working-directory: native/cobblestone-core-php
        shell: bash
        run: |
          cargo +1.98.0 fmt --check
          cargo +1.98.0 check
          cargo +1.98.0 clippy -- -D warnings
          cargo +1.98.0 build --release
      - name: Build Windows PHP adapter
        if: runner.os == 'Windows'
        working-directory: native/cobblestone-core-php
        shell: pwsh
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        run: |
          cargo +nightly-2026-09-20 fmt --check
          cargo +nightly-2026-09-20 check
          cargo +nightly-2026-09-20 clippy -- -D warnings
          cargo +nightly-2026-09-20 build --release
      - name: Validate and measure Linux PHP adapter
        if: runner.os == 'Linux'
        shell: bash
        run: |
          extension="$PWD/native/cobblestone-core-php/target/release/libcobblestone_core_php.so"
          php -n -d "extension=$extension" tests/php/extension-smoke.php
          php -n -d "extension=$extension" tests/php/fiber-smoke.php
          php -n -d "extension=$extension" benchmarks/php-boundary.php
      - name: Validate and measure Windows PHP adapter
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $extension = (Resolve-Path "native/cobblestone-core-php/target/release/cobblestone_core_php.dll").Path
          php -n -d "extension=$extension" tests/php/extension-smoke.php
          php -n -d "extension=$extension" tests/php/fiber-smoke.php
          php -n -d "extension=$extension" benchmarks/php-boundary.php

  ai-ci-summary:
    name: ai-ci-summary
    if: ${{ always() }}
    needs: [validate, php-zts]
    runs-on: ubuntu-latest
    steps:
      - name: Summarize required checks
        shell: bash
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          PHP_ZTS_RESULT: ${{ needs.php-zts.result }}
        run: |
          {
            echo "### Cobblestone CI"
            echo
            echo "- validate: $VALIDATE_RESULT"
            echo "- php-zts: $PHP_ZTS_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"

          test "$VALIDATE_RESULT" = "success"
          test "$PHP_ZTS_RESULT" = "success"
