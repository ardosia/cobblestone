[package]
name = "cobblestone-core-php"
version = "0.0.1"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ardosia/cobblestone"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
cobblestone-codec = { path = "../codec" }
cobblestone-core = { path = "../core" }
cobblestone-network = { path = "../network" }
cobblestone-session = { path = "../session" }
cobblestone-storage = { path = "../storage" }
ext-php-rs = "=0.15.15"

[workspace]
resolver = "3"
