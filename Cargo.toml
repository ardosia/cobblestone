[workspace]
resolver = "3"
members = [
    "modules/rust/core",
    "modules/rust/codec",
    "modules/rust/network",
    "modules/rust/session",
    "tests/rust/client-bootstrap",
    "tests/rust/runtime-probe",
]
exclude = [
    "modules/rust/php-extension",
]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ardosia/cobblestone"

[workspace.dependencies]
bitflags = "2"
bytes = "1.8"
crossbeam-channel = "0.5"
flate2 = "1.1"
proptest = "1"
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
tracing = "0.1"
raknet-rust = { git = "https://github.com/ardosia/ardosia-raknet", rev = "55b57787b6715ef2a931631ef4b690e3df0651e5" }
