[workspace]
resolver = "3"
members = [
    "native/target",
    "native/runtime",
    "native/world",
    "native/protocol84",
    "native/transport",
    "native/session",
    "native/storage",
    "tests/rust/client-bootstrap",
    "tests/rust/runtime-probe",
    "dev/xtask",
]
exclude = [
    "native/extension",
]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ardosia/cobblestone"

[workspace.dependencies]
cobblestone-target = { path = "native/target" }
bitflags = "2"
bytes = "1.8"
crossbeam-channel = "0.5"
crc32c = "0.6"
flate2 = "1.1"
proptest = "1"
zstd = "0.13"
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
tracing = "0.1"
raknet-rust = { git = "https://github.com/ardosia/ardosia-raknet", rev = "f0dbbfb8ef95cdea52dba16ee10c197e75560964" }

[workspace.lints.rust]
unsafe_code = "forbid"

# Ratchet: move lints here from the CI "rust-strict" job once their count reaches zero.
[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
