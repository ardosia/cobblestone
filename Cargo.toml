[workspace]
resolver = "3"
members = [
    "native/cobblestone-core",
    "native/cobblestone-runtime-probe",
]
exclude = [
    "native/cobblestone-core-php",
]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ardosia/cobblestone"
