schema = 1
change = "c003-multiruntime-torture"

[[tasks]]
id = "substrate"
status = "verified"
depends_on = []
acceptance = "Select and encapsulate an initial PHP 8.5 ZTS multi-runtime substrate behind a Cobblestone-owned abstraction without making it public API."

[[tasks]]
id = "runtime-harness"
status = "verified"
depends_on = ["substrate"]
acceptance = "Start at least two persistent runtimes with bounded command/completion queues and deterministic lifecycle control."

[[tasks]]
id = "message-torture"
status = "verified"
depends_on = ["runtime-harness"]
acceptance = "Route at least one million sequenced messages, detect loss/duplication/misrouting, and exercise queue saturation/backpressure."

[[tasks]]
id = "handle-churn"
status = "verified"
depends_on = ["runtime-harness"]
acceptance = "Stress native handle creation/destruction/reuse, stale probes, wrong-owner operations, and ownership-transfer epochs."

[[tasks]]
id = "completion-gc"
status = "verified"
depends_on = ["runtime-harness"]
acceptance = "Stress concurrent native completions and PHP cyclic GC while recording queue/memory/latency behavior."

[[tasks]]
id = "shutdown-restart"
status = "verified"
depends_on = ["message-torture", "handle-churn", "completion-gc"]
acceptance = "Repeat cancellation, orderly shutdown, and runtime restart without deadlock, stale completion execution, or use-after-destroy behavior."

[[tasks]]
id = "platforms"
status = "verified"
depends_on = ["shutdown-restart"]
acceptance = "Run the prototype on Linux and Windows where the controlled PHP 8.5 ZTS substrate is available and record platform limitations explicitly."

[[tasks]]
id = "decision"
status = "done"
depends_on = ["platforms"]
acceptance = "Record the evidence-backed go/no-go decision and alternatives if the initial substrate is unstable before production gameplay proceeds."
