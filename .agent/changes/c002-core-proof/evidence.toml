[[evidence]]
id = "completion-fiber-ci"
kind = "validation"
status = "passed"
claim = "An owner-tagged native completion is taken by the submitting PHP runtime and used by PHP to resume a suspended Fiber without a worker invoking Zend."
source = "ardosia/cobblestone@cb19ab75916784b602859d1097a0e414091c5c28 GitHub check runs"
result = "validate and php-zts jobs completed successfully on Ubuntu and Windows. The Fiber smoke test submitted native work tagged to the current RuntimeId, suspended a PHP Fiber, nonblockingly polled/took the completion on that same runtime, resumed the Fiber from PHP, and observed the expected result. The extension also shut down its lazy worker registry through the module-shutdown callback."
trust = "runtime-validation"
confidence = "observed"
limitations = "This is a diagnostic event-loop proof, not the final C007 server scheduler."

[[evidence]]
id = "c002-benchmarks"
kind = "benchmark"
status = "passed"
claim = "C002 records exact-revision Linux and Windows baselines for native and PHP-boundary costs without imposing invented pass thresholds."
source = "ardosia/cobblestone@d18a07361987ca02a6b5eccc4706391aa1789e8b GitHub check runs"
result = "All four exact-revision CI jobs passed. Native Ubuntu: handle lookup 0.65 ns/op; worker submit 132.24 ns/op; explicit 64 KiB NativeBuffer copy 2114.06 ns/op; bounded queue capacity 64 returned Full as designed. Native Windows: handle lookup 1.01 ns/op; worker submit 120.07 ns/op; explicit 64 KiB copy 2469.00 ns/op; bounded queue Full observed. PHP Ubuntu: empty PHP-to-native call 51.16 ns/op; live handle lookup 73.72 ns/op; worker submit 286.06 ns/op; full native-completion/owner-Fiber-resume cycle 17984.86 ns/op. PHP Windows: empty call 111.33 ns/op; handle lookup 126.85 ns/op; worker submit 713.31 ns/op; Fiber completion/wake 2910.00 ns/op."
trust = "runtime-validation"
confidence = "observed"
limitations = "Shared CI runner measurements are noisy diagnostic baselines only. Buffer byte counts cover the explicit NativeBuffer payload copy and do not claim zero Zend/ext-php-rs marshalling overhead. These microbenchmarks are not player-capacity or production-throughput evidence."
