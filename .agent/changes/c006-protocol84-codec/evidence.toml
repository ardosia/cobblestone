[[evidence]]
id = "protocol84-source-oracle"
kind = "source-review"
status = "passed"
claim = "A pinned historical source revision explicitly targets MCPE 0.15.10 protocol 84 and supplies wire facts that align with the fixed-target executable packet vocabulary."
source = "KhronosDevs/PocketMine-MP@15272732371b4e7785cc9f45b6274b31198d518e README.md, src/pocketmine/protocol/Info.php, DataPacket.php, LoginPacket.php, BatchPacket.php, PlayStatusPacket.php, DisconnectPacket.php, BlockEntityDataPacket.php, BinaryStream.php, Binary.php, tests/fake_client.php, legacy/old-src/network/RakLibInterface.php, legacy/old-src/tile/Spawnable.php, legacy/old-src/nbt/NBT.php"
result = "The revision identifies MCPE 0.15.10 / CURRENT_PROTOCOL 84. Info.php assigns Login=0x01, PlayStatus=0x02, ServerToClientHandshake=0x03, ClientToServerHandshake=0x04, Disconnect=0x05, Batch=0x06, Text=0x07, SetTime=0x08, StartGame=0x09. DataPacket prepends the one-byte packet ID. The RakLib boundary prefixes game frames with 0xfe. Batch uses a big-endian 32-bit compressed length and zlib/DEFLATE; the decompressed stream is repeated big-endian 32-bit packet length plus raw packet bytes. Login uses big-endian protocol/compressed lengths, a 2 MiB decompressed cap, and little-endian 32-bit inner lengths for chain JSON and skin JWT. Spawnable serializes BlockEntityData named tags with NBT::LITTLE_ENDIAN; NBT.php uses little-endian 16-bit names/strings and little-endian fixed-width numeric/list/array primitives in that mode."
trust = "pinned-matching-source"
confidence = "cross-checked"
limitations = "This is historical third-party source evidence, not authority. Cobblestone independently implements the observed wire format and still requires exact-revision regression and real-client compatibility evidence."

