schema = 1
change = "php-package-workspace"

[[tasks]]
id = "package-layout"
status = "implemented"
depends_on = []
acceptance = "Move existing PHP responsibilities into lowercase modules/php packages while preserving PascalCase PHP namespaces and class names."

[[tasks]]
id = "package-manifests"
status = "implemented"
depends_on = ["package-layout"]
acceptance = "Give command/event/task/native-session/session/plugin/server individual Composer manifests with explicit dependency direction."

[[tasks]]
id = "root-composer"
status = "implemented"
depends_on = ["package-manifests"]
acceptance = "Use a modules/php/* path repository and server composition dependency at the root instead of a catch-all production PSR-4 mapping."

[[tasks]]
id = "ergonomics"
status = "implemented"
depends_on = ["root-composer"]
acceptance = "Provide composer setup/modules/check/build/test/verify/serve workflows and validate every local package manifest."

[[tasks]]
id = "ci-pause"
status = "implemented"
depends_on = []
acceptance = "Leave the existing Actions jobs available only by manual dispatch and do not use automatic CI as the active validation loop."

[[tasks]]
id = "verify"
status = "verified"
depends_on = ["ergonomics", "ci-pause"]
acceptance = "Run local Composer/package validation, canonical Rust validation, PHP extension build, and PHP integration tests on the persisted revision."