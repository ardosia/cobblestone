  "replace production ad-hoc printf/fprintf logging with a PSR-3 boundary and Monolog-backed Spring Boot-inspired console format without a banner",
  "give plugins structured scoped loggers without exposing Monolog as the plugin API",
  "replace the raw entrypoint while(true) loop with a monotonic paced tick loop that reports sustained lateness in milliseconds and ticks behind",
  "provide bounded catch-up/rebasing behavior so a badly late server does not spin indefinitely trying to repay stale deadlines",
  "implement idempotent graceful shutdown with explicit server states, stop requests, SIGINT/SIGTERM handling where pcntl is available, and a PHP shutdown hook",
  "make World::mutate a replayable functional mutation boundary with staged read-your-writes overlays, net-change detection, chunk revisions, conflict retry, and multi-chunk commit preflight",
  "route ordinary World mutation conveniences through the mutation coordinator while leaving generation/initialization as direct chunk construction",
  "add internal PHP execution-region identity/mapping and Rust RegionDirectory owner+epoch routing mechanism without exposing region/thread ceremony to normal plugin APIs",
  "remove current kernel-named smoke/harness surfaces and use server terminology",
  "record local composer setup + composer verify evidence on the persisted result revision before closure"
]

