status = "implemented"
depends_on = []
acceptance = "Provide a test-only protocol-8 listener with a structured protocol-84 MCPE advertisement, decode direct or batched Login, send the currently implemented bootstrap packet subset, and log the next client packet IDs without pretending this is the production server CLI."

[[tasks]]
