status = "verified"
depends_on = ["real-client-bootstrap"]
acceptance = "Run the actual fixed 0.15.10 client against the bootstrap harness, capture the exact boundary reached, and use the observed next packet/behavior to drive the next compatibility slice."

[[tasks]]
