status = "implemented"
depends_on = ["real-client-probe"]
acceptance = "Implement production session lifecycle above cobblestone-network and cobblestone-codec with explicit bounded ingress/egress, malformed-input handling, disconnect, and shutdown behavior."

[[tasks]]
id = "php-runtime"
status = "planned"
depends_on = ["session-kernel"]
acceptance = "Expose the single owning PHP 8.5 ZTS runtime kernel so gameplay/session semantics remain PHP-owned while native workers never invoke arbitrary Zend."

[[tasks]]
id = "events-commands-plugins"
status = "planned"
depends_on = ["php-runtime"]
acceptance = "Add minimal lifecycle/events, command dispatch, plugin loading, scheduler, and Fiber completion integration without exposing runtime/thread primitives."

[[tasks]]
id = "verify"
status = "planned"
depends_on = ["events-commands-plugins"]
acceptance = "Run canonical Linux/Windows validation, PHP-ZTS integration, and fixed real-client acceptance on the exact persisted revision before closure."
