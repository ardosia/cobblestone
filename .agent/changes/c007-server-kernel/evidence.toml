[[evidence]]
id = "chunk-radius-and-layered-chunk-oracle"
kind = "source-review"
status = "passed"
claim = "Packet 0x3d is RequestChunkRadius. The matching source responds with packet 0x3e ChunkRadiusUpdated, streams FullChunkData packet 0x34, and sends PLAYER_SPAWN after chunk loading reaches the spawn condition."
source = "KhronosDevs/PocketMine-MP@15272732371b4e7785cc9f45b6274b31198d518e legacy/old-src/network/protocol/Info.php, RequestChunkRadiusPacket.php, ChunkRadiusUpdatedPacket.php, FullChunkDataPacket.php, level/format/anvil/ChunkRequestTask.php, Player.php"
result = "RequestChunkRadius carries one big-endian int radius. ChunkRadiusUpdated carries one big-endian int radius. FullChunkData carries chunk X/Z big-endian ints, order byte, big-endian payload length, then layered data. The Anvil layered payload is block IDs, block data, skylight, block light, height map, big-endian biome colors, little-endian extra-data table, then tile NBT."
trust = "pinned-matching-historical-source"
confidence = "observed"
limitations = "The C007 probe uses all-air synthetic layered chunks solely to test the client transition; production chunk generation/storage remains later foundation work."

